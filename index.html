<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Германская империя 1mm Наш император </title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface: #1a1a1a;
            --primary: #8b0000;
            --gold: #d4af37;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --danger: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }
        h1, h2, h3, .brand { font-family: 'Cinzel', serif; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background-color: var(--surface);
            border-bottom: 2px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .brand { font-size: 28px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }

        .auth-buttons button {
            background: transparent; color: var(--text-main); border: 1px solid var(--gold);
            padding: 8px 20px; margin-left: 10px; cursor: pointer; transition: all 0.3s; border-radius: 3px;
        }

        .auth-buttons button:hover, .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
        .btn-primary { padding: 10px 20px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }

        main { padding: 40px 50px; max-width: 1200px; margin: 0 auto; }

        .search-bar {
            width: 100%; padding: 15px; margin-bottom: 30px;
            background: var(--surface); border: 1px solid #333;
            color: white; border-radius: 5px; font-size: 16px;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: var(--surface); border: 1px solid #2a2a2a;
            border-radius: 8px; overflow: hidden; position: relative;
        }
        .card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 2px solid var(--primary); }
        .card-info { padding: 15px; }
        .card-info h3 { color: var(--gold); }

        /* Админские элементы */
        #admin-section { display: none; margin-bottom: 50px; padding: 25px; border: 1px solid var(--gold); background: #151515; border-radius: 8px; }
        .admin-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 30px; }
        .admin-form input { padding: 10px; background: #000; border: 1px solid #444; color: white; }
        
        .request-card { background: #222; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 5px 10px; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn-approve { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--surface); padding: 30px; width: 400px; border: 1px solid var(--gold); border-radius: 8px; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid #444; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="brand">Германская империя</div>
        <div id="auth-ui" class="auth-buttons">
            <button onclick="openModal('login-modal')">Войти</button>
            <button onclick="openModal('register-modal')" class="btn-primary">Регистрация</button>
        </div>
        <div id="user-ui" class="auth-buttons" style="display: none;">
            <span id="user-greeting" style="color: var(--gold); margin-right: 15px;"></span>
            <button onclick="logout()">Выйти</button>
        </div>
    </header>

    <main>
        <div id="admin-section">
            <h2 style="color: var(--gold); margin-bottom: 20px;">Панель Управления Империей</h2>
            
            <h3>Быстрое добавление гражданина</h3>
            <div class="admin-form">
                <input type="text" id="manual-name" placeholder="Имя">
                <input type="text" id="manual-id" placeholder="ID Код">
                <input type="text" id="manual-photo" placeholder="Ссылка на фото (URL)">
                <button class="btn-primary" onclick="manualAdd()">Добавить</button>
            </div>

            <h3>Заявки на вступление</h3>
            <div id="requests-list" style="margin-bottom: 30px;"></div>
        </div>

        <input type="text" id="search" class="search-bar" placeholder="Поиск по имени или номеру..." onkeyup="filter()">
        <h2 style="margin-bottom: 20px;">Реестр Жителей</h2>
        <div class="grid" id="main-grid"></div>
    </main>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Вход</h2>
            <input type="text" id="log-user" placeholder="Никнейм">
            <input type="password" id="log-pass" placeholder="Пароль">
            <button class="btn-primary" style="width:100%" onclick="login()">Войти</button>
            <button onclick="closeModal('login-modal')" style="background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Отмена</button>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <h2>Регистрация</h2>
            <input type="text" id="reg-user" placeholder="Никнейм">
            <input type="text" id="reg-id" placeholder="ID Код">
            <input type="password" id="reg-pass" placeholder="Пароль">
            <input type="file" id="reg-file">
            <button class="btn-primary" style="width:100%" onclick="register()">Отправить заявку</button>
            <button onclick="closeModal('register-modal')" style="background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Отмена</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTzzWYiqJq6UUhLNlGXfaeraqdy5vYb-E",
            authDomain: "ssss-e4774.firebaseapp.com",
            projectId: "ssss-e4774",
            storageBucket: "ssss-e4774.firebasestorage.app",
            messagingSenderId: "790324813183",
            appId: "1:790324813183:web:59e97ab75d5b8089d2ce4a",
            measurementId: "G-07H7PGDLSJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allCitizens = [];
        const getEmail = (u) => `${u.toLowerCase()}@empire.local`;

        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        // Авторизация
        window.login = async () => {
            try {
                await signInWithEmailAndPassword(auth, getEmail(document.getElementById('log-user').value), document.getElementById('log-pass').value);
                closeModal('login-modal');
            } catch (e) { alert("Ошибка входа!"); }
        };

        window.logout = () => signOut(auth);

        window.register = async () => {
            const user = document.getElementById('reg-user').value;
            const id = document.getElementById('reg-id').value;
            const pass = document.getElementById('reg-pass').value;
            const file = document.getElementById('reg-file').files[0];

            if (user.toLowerCase() === '1mm') {
                await createUserWithEmailAndPassword(auth, getEmail(user), pass);
                alert("Админ создан!"); closeModal('register-modal'); return;
            }

            const sRef = ref(storage, `pics/${Date.now()}`);
            await uploadBytes(sRef, file);
            const url = await getDownloadURL(sRef);

            await addDoc(collection(db, "pending_requests"), { name: user, idCode: id, photoUrl: url });
            alert("Заявка ушла!"); closeModal('register-modal');
        };

        // Админские действия
        window.manualAdd = async () => {
            const name = document.getElementById('manual-name').value;
            const id = document.getElementById('manual-id').value;
            const url = document.getElementById('manual-photo').value;
            await addDoc(collection(db, "citizens"), { name, idCode: id, photoUrl: url });
            alert("Добавлен!");
        };

        window.approve = async (dId, name, idCode, photoUrl) => {
            await addDoc(collection(db, "citizens"), { name, idCode, photoUrl });
            await deleteDoc(doc(db, "pending_requests", dId));
        };

        window.removeCitizen = async (id) => {
            if(confirm("Удалить жителя?")) await deleteDoc(doc(db, "citizens", id));
        };

        // Слушатели данных
        onAuthStateChanged(auth, (user) => {
            const is1mm = user && user.email.startsWith('1mm@');
            document.getElementById('auth-ui').style.display = user ? 'none' : 'flex';
            document.getElementById('user-ui').style.display = user ? 'flex' : 'none';
            document.getElementById('admin-section').style.display = is1mm ? 'block' : 'none';
            if(user) document.getElementById('user-greeting').innerText = user.email.split('@')[0];
            
            window.isCurrentAdmin = is1mm;
            renderMain(); 
        });

        onSnapshot(collection(db, "citizens"), (s) => {
            allCitizens = s.docs.map(d => ({id: d.id, ...d.data()}));
            renderMain();
        });

        onSnapshot(collection(db, "pending_requests"), (s) => {
            const list = document.getElementById('requests-list');
            list.innerHTML = s.docs.map(d => `
                <div class="request-card">
                    <span>${d.data().name} (${d.data().idCode})</span>
                    <button class="btn-approve" onclick="approve('${d.id}','${d.data().name}','${d.data().idCode}','${d.data().photoUrl}')">Одобрить</button>
                </div>
            `).join('');
        });

        function renderMain(data = allCitizens) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = data.map(c => `
                <div class="card">
                    <img src="${c.photoUrl}">
                    <div class="card-info">
                        <h3>${c.name}</h3>
                        <p>ID: ${c.idCode}</p>
                        ${window.isCurrentAdmin ? `<button class="btn-delete" onclick="removeCitizen('${c.id}')">Удалить</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.filter = () => {
            const q = document.getElementById('search').value.toLowerCase();
            renderMain(allCitizens.filter(c => c.name.toLowerCase().includes(q) || c.idCode.includes(q)));
        };
    </script>
</body>
</html>
